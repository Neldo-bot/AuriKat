name: AuriKat Dual-Build CI & Segregation Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - name: Upload Player Artifact (0 clinical bytes)
        uses: actions/upload-artifact@v4
        with:
          name: aurikat-player-dist
          path: apps/player/dist
      - name: Upload Clinical Portal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurikat-clinical-dist
          path: apps/clinical/dist
